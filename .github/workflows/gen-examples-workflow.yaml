---
name: Generate Examples
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.STUDIO_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.0.0
        with:
          image: cliffano/studio:3.2.0
          command: 'make gen-examples'
      - uses: cliffano/command-docker-action@v2.0.0
        with:
          image: cliffano/studio:3.2.0
          command: 'make ci'
      - uses: cliffano/save-changes-action@v1.0.0
        with:
          message: "Generate example components to latest"
          github_token: ${{ secrets.STUDIO_GITHUB_TOKEN }}
